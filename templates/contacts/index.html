<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <h1>Tambah Kontak</h1>
    <form hx-post="{% url 'contacts:contact_add' %}"
          hx-target="#contact-rows"
          hx-swap="beforeend"
          hx-on::after-request="if (event.detail.xhr.status === 201) this.reset()">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Nama" aria-label="Nama" maxlength="100" required>
        <input type="email" name="email" placeholder="Email" aria-label="Email" maxlength="254" required>
        <input type="tel" name="phone" placeholder="Nomor telepon" aria-label="Nomor telepon" maxlength="30">
        <button type="submit">Tambah</button>
    </form>

    <div id="feedback" role="status" aria-live="polite"></div>

    <h1>Daftar Kontak</h1>
    <input type="search" name="q" placeholder="Cari kontak..." aria-label="Cari kontak"
           hx-get="{% url 'contacts:contact_search' %}"
           hx-trigger="keyup changed delay:300ms, search"
           hx-target="#contact-rows"
           hx-indicator="#search-indicator">
    <span id="search-indicator" class="htmx-indicator">Mencari...</span>

    <table>
        <thead>
            <tr><th>Nama</th><th>Email</th><th>Nomor telepon</th><th></th></tr>
        </thead>
        <tbody id="contact-rows">
            {% include "contacts/_contact_rows.html" %}
        </tbody>
    </table>
</body>
</html>
